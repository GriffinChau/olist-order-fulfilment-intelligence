<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="660" viewBox="0 0 1140 660" role="img" aria-label="Olist reviews: average 4.29 for on-time delivery versus 2.27 for late delivery, source based association not causation.">
<rect width="1140" height="660" fill="#f2f6fa"/><rect width="1140" height="98" fill="#152b42"/>
<g font-family="Arial,sans-serif">
<text x="43" y="43" font-size="27" font-weight="bold" fill="#fff">DELIVERY EXPERIENCE &amp; CUSTOMER REVIEWS</text><text x="43" y="77" font-size="17" fill="#c6dbe4">Source-verified review results by customer delivery outcome</text>
<rect x="40" y="125" width="1060" height="208" rx="13" fill="#fff" stroke="#d4e1e7"/>
<text x="62" y="164" font-size="21" font-weight="bold" fill="#20384e">Average review score</text>
<text x="65" y="217" fill="#29465b" font-size="18">On-time or early</text><rect x="295" y="196" width="460" height="30" rx="6" fill="#e4ebf1"/><rect x="295" y="196" width="394.7" height="30" rx="6" fill="#0f8179"/><text x="780" y="218" fill="#29465b" font-size="19" font-weight="bold">4.29 / 5</text>
<text x="65" y="271" fill="#29465b" font-size="18">Late delivery</text><rect x="295" y="250" width="460" height="30" rx="6" fill="#e4ebf1"/><rect x="295" y="250" width="208.8" height="30" rx="6" fill="#c78c62"/><text x="780" y="272" fill="#29465b" font-size="19" font-weight="bold">2.27 / 5</text>
<rect x="40" y="355" width="1060" height="205" rx="13" fill="#fff" stroke="#d4e1e7"/>
<text x="62" y="392" font-size="21" font-weight="bold" fill="#20384e">Share of low review scores (1-2 out of 5)</text>
<text x="65" y="447" fill="#29465b" font-size="18">On-time or early</text><rect x="295" y="426" width="460" height="30" rx="6" fill="#e4ebf1"/><rect x="295" y="426" width="42.5" height="30" rx="6" fill="#0f8179"/><text x="780" y="448" fill="#29465b" font-size="19" font-weight="bold">9.23%</text>
<text x="65" y="501" fill="#29465b" font-size="18">Late delivery</text><rect x="295" y="480" width="460" height="30" rx="6" fill="#e4ebf1"/><rect x="295" y="480" width="286.9" height="30" rx="6" fill="#c78c62"/><text x="780" y="502" fill="#29465b" font-size="19" font-weight="bold">62.36%</text>
<rect x="40" y="584" width="1060" height="49" rx="11" fill="#e3f2ee"/>
<text x="61" y="615" font-size="16" fill="#276662" font-weight="bold">Interpretation: delivery timing and customer reviews are associated; the data do not prove causation.</text>
<text x="43" y="652" font-size="14" fill="#6b7f8d">Source: Olist delivered orders and valid customer reviews. Reviewed counts: on-time 89,443, late 6,381.</text>
</g></svg>