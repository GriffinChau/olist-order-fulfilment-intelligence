<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-label="How does delivery relate to reviews? — historical Olist dashboard"><title>How does delivery relate to reviews?</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F3FAF8"/><stop offset="100%" stop-color="#EBF4F1"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#02473F"/><stop offset="100%" stop-color="#00362F"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7BD5C8" stop-opacity=".42"/><stop offset="100%" stop-color="#D5F4EE" stop-opacity=".18"/></linearGradient><filter id="shadow" x="-6%" y="-7%" width="114%" height="121%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4B756D" flood-opacity=".11"/></filter></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1440" height="1020" rx="0" fill="url(#bg)" /><rect x="0" y="0" width="230" height="1020" rx="0" fill="url(#side)" /><circle cx="-22" cy="1007" r="112" fill="#0C7267" opacity=".55"/><circle cx="92" cy="1056" r="93" fill="#075E53" opacity=".55"/><rect x="20" y="42" width="6" height="54" rx="4" fill="#079786" /><text x="35" y="67" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="start" >OLIST</text><text x="35" y="91" font-size="13" fill="#D0E5E1" font-weight="400" text-anchor="start" >DELIVERY INTELLIGENCE</text><line x1="24" y1="135" x2="208" y2="135" stroke="#35796E" stroke-width="1" /><text x="30" y="166" font-size="12" fill="#B0D7D0" font-weight="700" text-anchor="start" >REPORT PAGES</text><text x="28" y="210" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >00</text><text x="66" y="210" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Executive summary</text><text x="28" y="257" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >01</text><text x="66" y="257" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Delivery performance</text><text x="28" y="304" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >02</text><text x="66" y="304" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Customer regions</text><rect x="12" y="325" width="206" height="40" rx="10" fill="#11685E" /><rect x="12" y="325" width="5" height="40" rx="3" fill="#35D2B7" /><text x="28" y="351" font-size="14" fill="#68E6CE" font-weight="700" text-anchor="start" >03</text><text x="66" y="351" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start" >Customer experience</text><text x="28" y="398" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >04</text><text x="66" y="398" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Product &amp; freight</text><line x1="24" y1="654" x2="208" y2="654" stroke="#36776D" stroke-width="1" /><text x="29" y="687" font-size="13" fill="#BEDCD7" font-weight="700" text-anchor="start" >DATA BASIS</text><text x="29" y="718" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" >Olist public records</text><text x="29" y="742" font-size="14" fill="#C6DEDA" font-weight="400" text-anchor="start" >Brazil | 2016–2018</text><text x="29" y="765" font-size="14" fill="#C6DEDA" font-weight="400" text-anchor="start" >Currency: BRL</text><rect x="27" y="786" width="177" height="34" rx="10" fill="#0A6157" /><text x="115" y="808" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" >SOURCE-VERIFIED</text><text x="257" y="47" font-size="15" fill="#0A8277" font-weight="700" text-anchor="start" >03 / CUSTOMER EXPERIENCE</text><text x="257" y="96" font-size="36" fill="#10242A" font-weight="700" text-anchor="start" >How does delivery relate to reviews?</text><text x="258" y="132" font-size="17" fill="#5D7480" font-weight="400" text-anchor="start" >Observed association between delivery timing and customer review scores.</text><rect x="1184" y="34" width="222" height="34" rx="17" fill="#D8F2EC" /><text x="1295" y="56" font-size="14" fill="#194C45" font-weight="700" text-anchor="middle" >OLIST · REAL DATA</text><rect x="252" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="268" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="291" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >ON-TIME REVIEW</text><text x="291" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >4.29 / 5</text><text x="291" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >89,443 reviewed on-time</text><rect x="543" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="559" y="195" width="7" height="95" rx="4" fill="#D9854C" /><text x="582" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >LATE REVIEW</text><text x="582" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >2.27 / 5</text><text x="582" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >6,381 reviewed late</text><rect x="834" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="850" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="873" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >LOW RATING · ON TIME</text><text x="873" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >9.23%</text><text x="873" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >Scores 1–2 out of 5</text><rect x="1125" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="1141" y="195" width="7" height="95" rx="4" fill="#D9854C" /><text x="1164" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >LOW RATING · LATE</text><text x="1164" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >62.36%</text><text x="1164" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >Scores 1–2 out of 5</text><rect x="252" y="339" width="565" height="403" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><text x="273" y="374" font-size="23" fill="#13272E" font-weight="700" text-anchor="start" >Average customer review score</text><text x="273" y="398" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Valid reviews · scale of 1 to 5</text><text x="276" y="478" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >On time / early</text><rect x="468" y="462" width="229" height="17" rx="8" fill="#E6EEEC" /><rect x="468" y="462" width="196.482" height="17" rx="8" fill="#079786" /><text x="794" y="478" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >4.29 / 5</text><text x="276" y="559" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >Late delivery</text><rect x="468" y="543" width="229" height="17" rx="8" fill="#E6EEEC" /><rect x="468" y="543" width="103.96600000000001" height="17" rx="8" fill="#D9854C" /><text x="794" y="559" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >2.27 / 5</text><text x="276" y="682" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >89,443 reviewed on time / early</text><text x="276" y="705" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >6,381 reviewed late</text><rect x="836" y="339" width="577" height="403" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><text x="857" y="374" font-size="23" fill="#13272E" font-weight="700" text-anchor="start" >Share of low customer ratings</text><text x="857" y="398" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Share scoring 1 or 2 out of 5</text><text x="860" y="478" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >On time / early</text><rect x="1052" y="462" width="241" height="17" rx="8" fill="#E6EEEC" /><rect x="1052" y="462" width="22.244300000000003" height="17" rx="8" fill="#079786" /><text x="1390" y="478" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >9.23%</text><text x="860" y="559" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >Late delivery</text><rect x="1052" y="543" width="241" height="17" rx="8" fill="#E6EEEC" /><rect x="1052" y="543" width="150.2876" height="17" rx="8" fill="#D9854C" /><text x="1390" y="559" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >62.36%</text><text x="860" y="691" font-size="15" fill="#D9854C" font-weight="700" text-anchor="start" >Difference: 53.13 percentage points</text><rect x="252" y="763" width="565" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="270" y="784" width="7" height="151" rx="4" fill="#079786" /><text x="293" y="806" font-size="14" fill="#079786" font-weight="700" text-anchor="start" >REVIEWED SAMPLE</text><text x="293" y="840" font-size="24" fill="#14272D" font-weight="700" text-anchor="start" >95,824 reviewed orders</text><text x="293" y="866" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >89,443 on-time / early + 6,381 late.</text><text x="293" y="889" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Multiple reviews per order are averaged first.</text><text x="293" y="912" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Not the number of original review events.</text><rect x="836" y="763" width="577" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="854" y="784" width="7" height="151" rx="4" fill="#D9854C" /><text x="877" y="806" font-size="14" fill="#D9854C" font-weight="700" text-anchor="start" >INTERPRETATION</text><text x="877" y="840" font-size="24" fill="#14272D" font-weight="700" text-anchor="start" >Association, not causation</text><text x="877" y="866" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Late arrivals align with lower average ratings.</text><text x="877" y="889" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Product quality and customer support may also matter.</text><text x="877" y="912" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Do not attribute reviews to timing alone.</text><line x1="257" y1="980" x2="1412" y2="980" stroke="#CBDEDA" stroke-width="1" /><text x="257" y="999" font-size="12" fill="#5D7480" font-weight="400" text-anchor="start" >Source: Olist Brazilian E-Commerce Public Dataset | Brazil 2016–2018 | BRL</text><text x="1408" y="999" font-size="12" fill="#5D7480" font-weight="400" text-anchor="end" >3 / 4</text></g></svg>