xt x="1380" y="502" font-size="20" fill="#142A31" font-weight="700" text-anchor="end">89,936</text><line x1="865" y1="518" x2="1380" y2="518" stroke="#E8EFEC"/><text x="865" y="560" font-size="18" fill="#607780" font-weight="400" text-anchor="start">Delivered late</text><text x="1380" y="560" font-size="20" fill="#142A31" font-weight="700" text-anchor="end">6,534</text><line x1="865" y1="576" x2="1380" y2="576" stroke="#E8EFEC"/><text x="865" y="618" font-size="18" fill="#607780" font-weight="400" text-anchor="start">Average lead time</text><text x="1380" y="618" font-size="20" fill="#142A31" font-weight="700" text-anchor="end">12.56 days</text><line x1="865" y1="634" x2="1380" y2="634" stroke="#E8EFEC"/><text x="865" y="676" font-size="18" fill="#607780" font-weight="400" text-anchor="start">March 2018 on-time</text><text x="1380" y="676" font-size="20" fill="#142A31" font-weight="700" text-anchor="end">81.04%</text><rect x="252" y="762" width="565" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="271" y="782" width="7" height="152" rx="4" fill="#D9854C" /><text x="293" y="804" font-size="14" fill="#D9854C" font-weight="700" text-anchor="start">SELLER FOOTPRINT</text><text x="293" y="840" font-size="22" fill="#142A31" font-weight="700" text-anchor="start">Location is not delivery</text><text x="293" y="872" font-size="14" fill="#607780" font-weight="400" text-anchor="start">23 states represented in the seller master.</text><text x="293" y="896" font-size="14" fill="#607780" font-weight="400" text-anchor="start">A seller may be linked to multiple orders.</text><text x="293" y="920" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Seller ID count is not a service quality metric.</text><rect x="836" y="762" width="577" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="855" y="782" width="7" height="152" rx="4" fill="#079786" /><text x="877" y="804" font-size="14" fill="#079786" font-weight="700" text-anchor="start">PROJECT STATUS</text><text x="877" y="840" font-size="22" fill="#142A31" font-weight="700" text-anchor="start">Customer delivery is analysed</text><text x="877" y="872" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Order-level, regional and monthly metrics exist.</text><text x="877" y="896" font-size="14" fill="#607780" font-weight="400" text-anchor="start">The published aggregates are reconciled.</text><text x="877" y="920" font-size="14" fill="#607780" font-weight="400" text-anchor="start">See the main dashboard for management insights.</text><line x1="254" y1="980" x2="1414" y2="980" stroke="#C9DFD9"/><text x="254" y="1000" font-size="12" fill="#607780" font-weight="400" text-anchor="start">Source: Olist Brazilian E-Commerce Public Dataset | Brazil 2016–2018 | BRL</text><text x="1408" y="1000" font-size="12" fill="#607780" font-weight="400" text-anchor="end">Portfolio</text></g></svg>