  <text x="942" y="164" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">4. RECOMMEND</text>
  <text x="942" y="211" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#263F57">Investigate March</text>
  <text x="942" y="237" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#263F57">2018 exceptions</text>
  <text x="942" y="272" font-family="Arial,sans-serif" font-size="14" fill="#476D6C">Validate routes, carrier</text>
  <text x="942" y="295" font-family="Arial,sans-serif" font-size="14" fill="#476D6C">milestones &amp; order mix</text>

  <rect x="34" y="356" width="1102" height="83" rx="12" fill="#E5F2F0"/>
  <text x="52" y="387" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#126B66">NEXT EVIDENCE NEEDED</text>
  <text x="52" y="415" font-family="Arial,sans-serif" font-size="15" fill="#2F5156">Carrier scans, fulfilment events, dispatch locations and true cost records before testing root causes or savings.</text>

  <text x="39" y="469" font-family="Arial,sans-serif" font-size="14" fill="#607687">Historical, independent portfolio study. On-time is customer delivery vs estimated date, not supplier inbound OTIF.</text>
