  <text x="50" y="244" font-family="Arial,sans-serif" font-size="15" fill="#61758A">99,441 unique orders</text>
  <text x="50" y="272" font-family="Arial,sans-serif" font-size="15" fill="#61758A">Track source provenance</text>
  <text x="50" y="299" font-family="Arial,sans-serif" font-size="13" fill="#127F78">Source documents retained</text>

  <path d="M297 226 H323 M313 218 L323 226 L313 234" stroke="#128980" fill="none" stroke-width="4" stroke-linecap="round"/>

  <rect x="331" y="136" width="255" height="193" rx="13" fill="#FFFFFF" stroke="#D2E2EA"/>
  <rect x="331" y="136" width="255" height="43" rx="13" fill="#173C54"/>
  <rect x="331" y="158" width="255" height="21" fill="#173C54"/>
  <text x="347" y="164" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">2. CLEAN &amp; VERIFY</text>
  <text x="347" y="211" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#263F57">Order-grain ETL</text>
  <text x="347" y="244" font-family="Arial,sans-serif" font-size="15" fill="#61758A">96,470 eligible deliveries</text>
  <text x="347" y="272" font-family="Arial,sans-serif" font-size="15" fill="#61758A">8 excluded: missing dates</text>
  <text x="347" y="299" font-family="Arial,sans-serif" font-size="13" fill="#127F78">Counts &amp; totals reconciled</text>

  <path d="M595 226 H620 M610 218 L620 226 L610 234" stroke="#128980" fill="none" stroke-width="4" stroke-linecap="round"/>

  <rect x="628" y="136" width="255" height="193" rx="13" fill="#FFFFFF" stroke="#D2E2EA"/>
  <rect x="628" y="136" width="255" height="43" rx="13" fill="#173C54"/>
  <rect x="628" y="158" width="255" height="21" fill="#173C54"/>
  <text x="644" y="164" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">3. FIND PATTERNS</text>
  <text x="644" y="211" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#263F57">93.23% delivered on time</text>
  <text x="644" y="244" font-family="Arial,sans-serif" font-size="15" fill="#61758A">6,534 late deliveries</text>
  <text x="644" y="272" font-family="Arial,sans-serif" font-size="15" fill="#61758A">Mar 2018: 81.04% on time</text>
  <text x="644" y="299" font-family="Arial,sans-serif" font-size="13" fill="#127F78">Monthly &amp; regional views</text>

  <path d="M892 226 H918 M908 218 L918 226 L908 234" stroke="#128980" fill="none" stroke-width="4" stroke-linecap="round"/>

