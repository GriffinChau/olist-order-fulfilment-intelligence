<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1170 490" width="1170" height="490" role="img" aria-label="Olist data-to-decision flow: eight original CSVs, verified order-grain analysis of 99,441 orders, customer delivery insights and recommended investigations">
