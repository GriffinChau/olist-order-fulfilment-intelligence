<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020" role="img" aria-label="How do raw records become a decision?"><title>How do raw records become a decision?</title><defs><linearGradient id="pageBg"><stop offset="0%" stop-color="#F4FAF7"/><stop offset="100%" stop-color="#EDF5F2"/></linearGradient><linearGradient id="sideBg" x2="0" y2="1"><stop offset="0%" stop-color="#02473F"/><stop offset="100%" stop-color="#00362F"/></linearGradient><filter id="shadow" x="-5%" y="-5%" width="112%" height="118%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#38665D" flood-opacity=".13"/></filter></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1440" height="1020" rx="0" fill="url(#pageBg)" /><rect x="0" y="0" width="230" height="1020" rx="0" fill="url(#sideBg)" /><circle cx="-8" cy="1000" r="95" fill="#12675D" opacity=".48"/><rect x="20" y="42" width="6" height="53" rx="3" fill="#079786" /><text x="36" y="67" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="start">OLIST</text><text x="36" y="92" font-size="13" fill="#C3DFD9" font-weight="400" text-anchor="start">DELIVERY INTELLIGENCE</text><line x1="25" y1="134" x2="207" y2="134" stroke="#508C81"/><text x="29" y="168" font-size="12" fill="#BBDCD7" font-weight="700" text-anchor="start">REPORT PAGES</text><text x="30" y="210" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">00</text><text x="66" y="210" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Executive summary</text><text x="30" y="257" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">01</text><text x="66" y="257" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Delivery performance</text><text x="30" y="304" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">02</text><text x="66" y="304" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Customer regions</text><text x="30" y="351" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">03</text><text x="66" y="351" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Customer experience</text><text x="30" y="398" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">04</text><text x="66" y="398" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Product &amp; freight</text><line x1="25" y1="448" x2="207" y2="448" stroke="#508C81"/><text x="30" y="477" font-size="12" fill="#BBDCD7" font-weight="700" text-anchor="start">SUPPORTING VISUALS</text><rect x="12" y="489" width="205" height="42" rx="9" fill="#11685E" /><rect x="12" y="489" width="5" height="42" rx="2" fill="#35D2B7" /><text x="28" y="515" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">Analysis to action</text><line x1="25" y1="603" x2="207" y2="603" stroke="#508C81"/><text x="30" y="631" font-size="12" fill="#BBDCD7" font-weight="700" text-anchor="start">DATA BASIS</text><text x="30" y="665" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Olist public records</text><text x="30" y="689" font-size="14" fill="#C7E1DD" font-weight="400" text-anchor="start">Brazil | 2016–2018</text><text x="30" y="713" font-size="14" fill="#C7E1DD" font-weight="400" text-anchor="start">Currency: BRL</text><rect x="26" y="736" width="175" height="34" rx="10" fill="#0D6459" /><text x="114" y="758" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">SOURCE-VERIFIED</text><text x="254" y="47" font-size="15" fill="#079786" font-weight="700" text-anchor="start">ANALYSIS TO ACTION</text><text x="254" y="96" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">How do raw records become a decision?</text><text x="255" y="132" font-size="17" fill="#607780" font-weight="400" text-anchor="start">A traceable process from source records to management recommendations.</text><rect x="1183" y="34" width="222" height="34" rx="17" fill="#D8F2EC" /><text x="1294" y="56" font-size="14" fill="#194C45" font-weight="700" text-anchor="middle">OLIST · REAL DATA</text><rect x="252" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="268" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="291" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">SOURCE FILES</text><text x="291" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">8</text><text x="291" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">Original Olist public CSVs</text><rect x="543" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="559" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="582" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">ORDERS</text><text x="582" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">99,441</text><text x="582" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">Unique customer orders</text><rect x="834" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="850" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="873" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">ELIGIBLE ORDERS</text><text x="873" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">96,470</text><text x="873" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">Delivered with both dates</text><rect x="1125" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="1141" y="195" width="7" height="95" rx="4" fill="#D9854C" /><text x="1164" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">ON-TIME RATE</text><text x="1164" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">93.23%</text><text x="1164" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">89,936 on time; 6,534 late</text><rect x="252" y="339" width="279" height="409" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="272" y="366" width="60" height="60" rx="30" fill="#E1F5EF" /><text x="302" y="406" font-size="24" fill="#079786" font-weight="700" text-anchor="middle">01</text><text x="272" y="470" font-size="16" fill="#079786" font-weight="700" text-anchor="start">SOURCE &amp; GRAIN</text><text x="272" y="506" font-size="23" fill="#142A31" font-weight="700" text-anchor="start">Public records</text><rect x="272" y="548" width="5" height="17" rx="2" fill="#D9854C" /><text x="286" y="561" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Eight original CSV files</text><rect x="272" y="590" width="5" height="17" rx="2" fill="#079786" /><text x="286" y="603" font-size="14" fill="#607780" font-weight="400" text-anchor="start">99,441 unique orders</text><rect x="272" y="632" width="5" height="17" rx="2" fill="#079786" /><text x="286" y="645" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Preserve source provenance</text><text x="536" y="579" font-size="27" fill="#079786" font-weight="700" text-anchor="middle">›</text><rect x="543" y="339" width="279" height="409" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="563" y="366" width="60" height="60" rx="30" fill="#E1F5EF" /><text x="593" y="406" font-size="24" fill="#079786" font-weight="700" text-anchor="middle">02</text><text x="563" y="470" font-size="16" fill="#079786" font-weight="700" text-anchor="start">CLEAN &amp; VERIFY</text><text x="563" y="506" font-size="23" fill="#142A31" font-weight="700" text-anchor="start">Trusted metrics</text><rect x="563" y="548" width="5" height="17" rx="2" fill="#D9854C" /><text x="577" y="561" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Join at order grain</text><rect x="563" y="590" width="5" height="17" rx="2" fill="#079786" /><text x="577" y="603" font-size="14" fill="#607780" font-weight="400" text-anchor="start">96,470 eligible deliveries</text><rect x="563" y="632" width="5" height="17" rx="2" fill="#079786" /><text x="577" y="645" font-size="14" fill="#607780" font-weight="400" text-anchor="start">8 excluded for missing actual date</text><rect x="563" y="674" width="5" height="17" rx="2" fill="#079786" /><text x="577" y="687" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Reconcile orders and totals</text><text x="827" y="579" font-size="27" fill="#079786" font-weight="700" text-anchor="middle">›</text><rect x="834" y="339" width="279" height="409" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="854" y="366" width="60" height="60" rx="30" fill="#E1F5EF" /><text x="884" y="406" font-size="24" fill="#079786" font-weight="700" text-anchor="middle">03</text><text x="854" y="470" font-size="16" fill="#079786" font-weight="700" text-anchor="start">FIND PATTERNS</text><text x="854" y="506" font-size="23" fill="#142A31" font-weight="700" text-anchor="start">Descriptive findings</text><rect x="854" y="548" width="5" height="17" rx="2" fill="#D9854C" /><text x="868" y="561" font-size="14" fill="#607780" font-weight="400" text-anchor="start">93.23% delivered on time</text><rect x="854" y="590" width="5" height="17" rx="2" fill="#079786" /><text x="868" y="603" font-size="14" fill="#607780" font-weight="400" text-anchor="start">March 2018: 81.04%</text><rect x="854" y="632" width="5" height="17" rx="2" fill="#079786" /><text x="868" y="645" font-size="14" fill="#607780" font-weight="400" text-anchor="start">SP 95.51% vs RJ 87.89%</text><rect x="854" y="674" width="5" height="17" rx="2" fill="#079786" /><text x="868" y="687" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Late deliveries: lower reviews</text><text x="1118" y="579" font-size="27" fill="#079786" font-weight="700" text-anchor="middle">›</text><rect x="1125" y="339" width="279" height="409" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="1145" y="366" width="60" height="60" rx="30" fill="#E1F5EF" /><text x="1175" y="406" font-size="24" fill="#079786" font-weight="700" text-anchor="middle">04</text><text x="1145" y="470" font-size="16" fill="#079786" font-weight="700" text-anchor="start">RECOMMEND</text><text x="1145" y="506" font-size="23" fill="#142A31" font-weight="700" text-anchor="start">Investigations</text><rect x="1145" y="548" width="5" height="17" rx="2" fill="#D9854C" /><text x="1159" y="561" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Investigate March cohort</text><rect x="1145" y="590" width="5" height="17" rx="2" fill="#079786" /><text x="1159" y="603" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Compare routes and carriers</text><rect x="1145" y="632" width="5" height="17" rx="2" fill="#079786" /><text x="1159" y="645" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Check dispatch and order mix</text><rect x="1145" y="674" width="5" height="17" rx="2" fill="#079786" /><text x="1159" y="687" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Verify causes before action</text><rect x="252" y="772" width="1161" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="271" y="792" width="7" height="152" rx="4" fill="#D9854C" /><text x="293" y="814" font-size="14" fill="#D9854C" font-weight="700" text-anchor="start">NEXT EVIDENCE NEEDED</text><text x="293" y="850" font-size="22" fill="#142A31" font-weight="700" text-anchor="start">Use carrier events before testing root causes</text><text x="293" y="882" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Carrier scans, dispatch locations, service promises and actual invoices are still needed.</text><text x="293" y="906" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Customer delivery against estimates is not supplier inbound OTIF.</text><text x="293" y="930" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Recommendations are hypotheses, not confirmed savings.</text><line x1="254" y1="980" x2="1414" y2="980" stroke="#C9DFD9"/><text x="254" y="1000" font-size="12" fill="#607780" font-weight="400" text-anchor="start">Source: Olist Brazilian E-Commerce Public Dataset | Brazil 2016–2018 | BRL</text><text x="1408" y="1000" font-size="12" fill="#607780" font-weight="400" text-anchor="end">Portfolio</text></g></svg>