<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1020" width="1440" height="1020" role="img" aria-label="Which cities have the most sellers?"><title>Which cities have the most sellers?</title><defs><linearGradient id="pageBg"><stop offset="0%" stop-color="#F4FAF7"/><stop offset="100%" stop-color="#EDF5F2"/></linearGradient><linearGradient id="sideBg" x2="0" y2="1"><stop offset="0%" stop-color="#02473F"/><stop offset="100%" stop-color="#00362F"/></linearGradient><filter id="shadow" x="-5%" y="-5%" width="112%" height="118%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#38665D" flood-opacity=".13"/></filter></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1440" height="1020" rx="0" fill="url(#pageBg)" /><rect x="0" y="0" width="230" height="1020" rx="0" fill="url(#sideBg)" /><circle cx="-8" cy="1000" r="95" fill="#12675D" opacity=".48"/><rect x="20" y="42" width="6" height="53" rx="3" fill="#079786" /><text x="36" y="67" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="start">OLIST</text><text x="36" y="92" font-size="13" fill="#C3DFD9" font-weight="400" text-anchor="start">DELIVERY INTELLIGENCE</text><line x1="25" y1="134" x2="207" y2="134" stroke="#508C81"/><text x="29" y="168" font-size="12" fill="#BBDCD7" font-weight="700" text-anchor="start">REPORT PAGES</text><text x="30" y="210" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">00</text><text x="66" y="210" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Executive summary</text><text x="30" y="257" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">01</text><text x="66" y="257" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Delivery performance</text><text x="30" y="304" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">02</text><text x="66" y="304" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Customer regions</text><text x="30" y="351" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">03</text><text x="66" y="351" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Customer experience</text><text x="30" y="398" font-size="13" fill="#B2E3D7" font-weight="400" text-anchor="start">04</text><text x="66" y="398" font-size="14" fill="#E3F2EC" font-weight="400" text-anchor="start">Product &amp; freight</text><line x1="25" y1="448" x2="207" y2="448" stroke="#508C81"/><text x="30" y="477" font-size="12" fill="#BBDCD7" font-weight="700" text-anchor="start">SUPPORTING VISUALS</text><rect x="12" y="489" width="205" height="42" rx="9" fill="#11685E" /><rect x="12" y="489" width="5" height="42" rx="2" fill="#35D2B7" /><text x="28" y="515" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start">Top seller cities</text><line x1="25" y1="603" x2="207" y2="603" stroke="#508C81"/><text x="30" y="631" font-size="12" fill="#BBDCD7" font-weight="700" text-anchor="start">DATA BASIS</text><text x="30" y="665" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="start">Olist public records</text><text x="30" y="689" font-size="14" fill="#C7E1DD" font-weight="400" text-anchor="start">Brazil | 2016–2018</text><text x="30" y="713" font-size="14" fill="#C7E1DD" font-weight="400" text-anchor="start">Currency: BRL</text><rect x="26" y="736" width="175" height="34" rx="10" fill="#0D6459" /><text x="114" y="758" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle">SOURCE-VERIFIED</text><text x="254" y="47" font-size="15" fill="#079786" font-weight="700" text-anchor="start">SELLER CITIES</text><text x="254" y="96" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">Which cities have the most sellers?</text><text x="255" y="132" font-size="17" fill="#607780" font-weight="400" text-anchor="start">Seller-ID concentration from the historical public Olist master.</text><rect x="1183" y="34" width="222" height="34" rx="17" fill="#D8F2EC" /><text x="1294" y="56" font-size="14" fill="#194C45" font-weight="700" text-anchor="middle">OLIST · REAL DATA</text><rect x="252" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="268" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="291" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">SELLER IDS</text><text x="291" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">3,095</text><text x="291" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">Distinct sellers in source</text><rect x="543" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="559" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="582" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">SÃO PAULO CITY</text><text x="582" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">694</text><text x="582" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">Source seller-city IDs</text><rect x="834" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="850" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="873" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">SÃO PAULO SHARE</text><text x="873" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">22.42%</text><text x="873" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">694 / 3,095 seller IDs</text><rect x="1125" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="1141" y="195" width="7" height="95" rx="4" fill="#D9854C" /><text x="1164" y="208" font-size="14" fill="#607780" font-weight="700" text-anchor="start">TOP TEN CITIES</text><text x="1164" y="259" font-size="35" fill="#142A31" font-weight="700" text-anchor="start">1,254</text><text x="1164" y="284" font-size="13" fill="#607780" font-weight="400" text-anchor="start">40.52% of seller IDs</text><rect x="252" y="339" width="677" height="403" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><text x="273" y="374" font-size="23" fill="#142A31" font-weight="700" text-anchor="start">Seller IDs by city</text><text x="273" y="398" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Top 10 source city/state values</text><text x="274" y="439" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">São Paulo · SP</text><rect x="519" y="423" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="423" width="287" height="18" rx="9" fill="#D9854C" /><text x="913" y="439" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">694</text><text x="274" y="468" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Curitiba · PR</text><rect x="519" y="452" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="452" width="51.279538904899134" height="18" rx="9" fill="#079786" /><text x="913" y="468" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">124</text><text x="274" y="497" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Rio de Janeiro · RJ</text><rect x="519" y="481" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="481" width="38.45965417867435" height="18" rx="9" fill="#079786" /><text x="913" y="497" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">93</text><text x="274" y="526" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Belo Horizonte · MG</text><rect x="519" y="510" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="510" width="27.29394812680115" height="18" rx="9" fill="#079786" /><text x="913" y="526" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">66</text><text x="274" y="555" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Ribeirão Preto · SP</text><rect x="519" y="539" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="539" width="21.504322766570606" height="18" rx="9" fill="#079786" /><text x="913" y="555" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">52</text><text x="274" y="584" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Guarulhos · SP</text><rect x="519" y="568" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="568" width="20.677233429394814" height="18" rx="9" fill="#079786" /><text x="913" y="584" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">50</text><text x="274" y="613" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Ibitinga · SP</text><rect x="519" y="597" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="597" width="20.263688760806918" height="18" rx="9" fill="#079786" /><text x="913" y="613" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">49</text><text x="274" y="642" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Santo André · SP</text><rect x="519" y="626" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="626" width="18.60951008645533" height="18" rx="9" fill="#079786" /><text x="913" y="642" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">45</text><text x="274" y="671" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Campinas · SP</text><rect x="519" y="655" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="655" width="16.955331412103746" height="18" rx="9" fill="#079786" /><text x="913" y="671" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">41</text><text x="274" y="700" font-size="15" fill="#142A31" font-weight="400" text-anchor="start">Maringá · PR</text><rect x="519" y="684" width="287" height="18" rx="9" fill="#E3ECE9" /><rect x="519" y="684" width="16.54178674351585" height="18" rx="9" fill="#079786" /><text x="913" y="700" font-size="15" fill="#142A31" font-weight="700" text-anchor="end">40</text><rect x="949" y="339" width="464" height="403" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><text x="970" y="374" font-size="23" fill="#142A31" font-weight="700" text-anchor="start">How to read this</text><text x="970" y="398" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Seller master, not fulfilment data</text><text x="973" y="442" font-size="16" fill="#607780" font-weight="400" text-anchor="start">São Paulo city holds 694 IDs.</text><text x="973" y="493" font-size="16" fill="#607780" font-weight="400" text-anchor="start">City and state are original source fields.</text><text x="973" y="544" font-size="16" fill="#607780" font-weight="400" text-anchor="start">Accents/spellings are display labels.</text><text x="973" y="595" font-size="16" fill="#607780" font-weight="400" text-anchor="start">Source city strings are not geocoded.</text><text x="973" y="646" font-size="16" fill="#607780" font-weight="400" text-anchor="start">No on-time conclusion follows.</text><rect x="252" y="762" width="677" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="271" y="782" width="7" height="152" rx="4" fill="#D9854C" /><text x="293" y="804" font-size="14" fill="#D9854C" font-weight="700" text-anchor="start">LOCATION CONCENTRATION</text><text x="293" y="840" font-size="22" fill="#142A31" font-weight="700" text-anchor="start">1,254 IDs in the top 10 cities</text><text x="293" y="872" font-size="14" fill="#607780" font-weight="400" text-anchor="start">40.52% of all marketplace seller IDs.</text><text x="293" y="896" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Useful to understand seller location concentration.</text><text x="293" y="920" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Not a measure of shipment or delivery volume.</text><rect x="949" y="762" width="464" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3"/><rect x="968" y="782" width="7" height="152" rx="4" fill="#079786" /><text x="990" y="804" font-size="14" fill="#079786" font-weight="700" text-anchor="start">LIMITATION</text><text x="990" y="840" font-size="22" fill="#142A31" font-weight="700" text-anchor="start">City ≠ performance</text><text x="990" y="872" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Do not infer warehouse capacity.</text><text x="990" y="896" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Do not infer service level from seller counts.</text><text x="990" y="920" font-size="14" fill="#607780" font-weight="400" text-anchor="start">Use linked order records to test questions.</text><line x1="254" y1="980" x2="1414" y2="980" stroke="#C9DFD9"/><text x="254" y="1000" font-size="12" fill="#607780" font-weight="400" text-anchor="start">Source: Olist Brazilian E-Commerce Public Dataset | Brazil 2016–2018 | BRL</text><text x="1408" y="1000" font-size="12" fill="#607780" font-weight="400" text-anchor="end">Portfolio</text></g></svg>