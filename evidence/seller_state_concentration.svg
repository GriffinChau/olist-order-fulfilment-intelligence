<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-label="Where are marketplace sellers based? — historical Olist dashboard"><title>Where are marketplace sellers based?</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F3FAF8"/><stop offset="100%" stop-color="#EBF4F1"/></linearGradient><linearGradient id="side" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#02473F"/><stop offset="100%" stop-color="#00362F"/></linearGradient><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7BD5C8" stop-opacity=".42"/><stop offset="100%" stop-color="#D5F4EE" stop-opacity=".18"/></linearGradient><filter id="shadow" x="-6%" y="-7%" width="114%" height="121%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4B756D" flood-opacity=".11"/></filter></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1440" height="1020" rx="0" fill="url(#bg)" /><rect x="0" y="0" width="230" height="1020" rx="0" fill="url(#side)" /><circle cx="-22" cy="1007" r="112" fill="#0C7267" opacity=".55"/><circle cx="92" cy="1056" r="93" fill="#075E53" opacity=".55"/><rect x="20" y="42" width="6" height="54" rx="4" fill="#079786" /><text x="35" y="67" font-size="31" fill="#FFFFFF" font-weight="700" text-anchor="start" >OLIST</text><text x="35" y="91" font-size="13" fill="#D0E5E1" font-weight="400" text-anchor="start" >DELIVERY INTELLIGENCE</text><line x1="24" y1="135" x2="208" y2="135" stroke="#35796E" stroke-width="1" /><text x="30" y="166" font-size="12" fill="#B0D7D0" font-weight="700" text-anchor="start" >REPORT PAGES</text><text x="28" y="210" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >00</text><text x="66" y="210" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Executive summary</text><text x="28" y="257" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >01</text><text x="66" y="257" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Delivery performance</text><text x="28" y="304" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >02</text><text x="66" y="304" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Customer regions</text><text x="28" y="351" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >03</text><text x="66" y="351" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Customer experience</text><text x="28" y="398" font-size="14" fill="#B8DAD4" font-weight="400" text-anchor="start" >04</text><text x="66" y="398" font-size="14" fill="#E4EFED" font-weight="400" text-anchor="start" >Product &amp; freight</text><line x1="24" y1="448" x2="208" y2="448" stroke="#36776D" stroke-width="1" /><text x="30" y="475" font-size="12" fill="#B0D7D0" font-weight="700" text-anchor="start" >SUPPORTING VISUALS</text><rect x="12" y="489" width="206" height="42" rx="10" fill="#11685E" /><rect x="12" y="489" width="5" height="42" rx="3" fill="#35D2B7" /><text x="27" y="516" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="start" >Seller footprint</text><line x1="24" y1="590" x2="208" y2="590" stroke="#36776D" stroke-width="1" /><text x="29" y="623" font-size="13" fill="#BEDCD7" font-weight="700" text-anchor="start" >DATA BASIS</text><text x="29" y="654" font-size="15" fill="#FFFFFF" font-weight="600" text-anchor="start" >Olist public records</text><text x="29" y="678" font-size="14" fill="#C6DEDA" font-weight="400" text-anchor="start" >Brazil | 2016–2018</text><text x="29" y="701" font-size="14" fill="#C6DEDA" font-weight="400" text-anchor="start" >Currency: BRL</text><rect x="27" y="722" width="177" height="34" rx="10" fill="#0A6157" /><text x="115" y="744" font-size="12" fill="#FFFFFF" font-weight="700" text-anchor="middle" >SOURCE-VERIFIED</text><text x="257" y="47" font-size="15" fill="#0A8277" font-weight="700" text-anchor="start" >SELLER FOOTPRINT</text><text x="257" y="96" font-size="36" fill="#10242A" font-weight="700" text-anchor="start" >Where are marketplace sellers based?</text><text x="258" y="132" font-size="17" fill="#5D7480" font-weight="400" text-anchor="start" >Geographic distribution of seller IDs in the Olist public seller master.</text><rect x="1184" y="34" width="222" height="34" rx="17" fill="#D8F2EC" /><text x="1295" y="56" font-size="14" fill="#194C45" font-weight="700" text-anchor="middle" >OLIST · REAL DATA</text><rect x="252" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="268" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="291" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >SELLER IDS</text><text x="291" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >3,095</text><text x="291" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >Distinct marketplace sellers</text><rect x="543" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="559" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="582" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >SELLER STATES</text><text x="582" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >23</text><text x="582" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >States in seller master</text><rect x="834" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="850" y="195" width="7" height="95" rx="4" fill="#079786" /><text x="873" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >SP SELLERS</text><text x="873" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >1,849</text><text x="873" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >Seller IDs in São Paulo</text><rect x="1125" y="172" width="279" height="143" rx="18" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="1141" y="195" width="7" height="95" rx="4" fill="#D9854C" /><text x="1164" y="208" font-size="14" fill="#5D7480" font-weight="700" text-anchor="start" >SP SHARE</text><text x="1164" y="259" font-size="35" fill="#142830" font-weight="700" text-anchor="start" >59.74%</text><text x="1164" y="283" font-size="13" fill="#5D7480" font-weight="400" text-anchor="start" >Of the 3,095 seller IDs</text><rect x="252" y="339" width="565" height="403" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><text x="273" y="374" font-size="23" fill="#13272E" font-weight="700" text-anchor="start" >Seller IDs by state</text><text x="273" y="398" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Eight highest seller-state counts</text><text x="275" y="448" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >SP</text><rect x="360" y="432" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="432" width="319" height="17" rx="8" fill="#D9854C" /><text x="794" y="448" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >1,849</text><text x="275" y="483" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >PR</text><rect x="360" y="467" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="467" width="60.21146565711195" height="17" rx="8" fill="#079786" /><text x="794" y="483" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >349</text><text x="275" y="518" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >MG</text><rect x="360" y="502" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="502" width="42.09626825310979" height="17" rx="8" fill="#079786" /><text x="794" y="518" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >244</text><text x="275" y="553" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >SC</text><rect x="360" y="537" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="537" width="32.77988101676582" height="17" rx="8" fill="#079786" /><text x="794" y="553" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >190</text><text x="275" y="588" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >RJ</text><rect x="360" y="572" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="572" width="29.50189291508924" height="17" rx="8" fill="#079786" /><text x="794" y="588" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >171</text><text x="275" y="623" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >RS</text><rect x="360" y="607" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="607" width="22.25581395348837" height="17" rx="8" fill="#079786" /><text x="794" y="623" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >129</text><text x="275" y="658" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >GO</text><rect x="360" y="642" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="642" width="6.901027582477015" height="17" rx="8" fill="#079786" /><text x="794" y="658" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >40</text><text x="275" y="693" font-size="14" fill="#243941" font-weight="500" text-anchor="start" >DF</text><rect x="360" y="677" width="319" height="17" rx="8" fill="#E6EEEC" /><rect x="360" y="677" width="5.175770686857761" height="17" rx="8" fill="#079786" /><text x="794" y="693" font-size="15" fill="#162B32" font-weight="700" text-anchor="end" >30</text><rect x="836" y="339" width="577" height="403" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><text x="857" y="374" font-size="23" fill="#13272E" font-weight="700" text-anchor="start" >How to interpret this</text><text x="857" y="398" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Source geography, not customer service outcomes</text><text x="867" y="444" font-size="18" fill="#24413F" font-weight="500" text-anchor="start" >Seller location ≠ customer destination</text><text x="867" y="493" font-size="18" fill="#24413F" font-weight="500" text-anchor="start" >Seller concentration ≠ on-time delivery</text><text x="867" y="542" font-size="18" fill="#24413F" font-weight="500" text-anchor="start" >State counts are distinct seller IDs</text><text x="867" y="591" font-size="18" fill="#24413F" font-weight="500" text-anchor="start" >Use alongside delivery and order data</text><text x="867" y="640" font-size="18" fill="#24413F" font-weight="500" text-anchor="start" >No root causes can be inferred here</text><rect x="252" y="763" width="565" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="270" y="784" width="7" height="151" rx="4" fill="#D9854C" /><text x="293" y="806" font-size="14" fill="#D9854C" font-weight="700" text-anchor="start" >KEY TAKEAWAY</text><text x="293" y="840" font-size="24" fill="#14272D" font-weight="700" text-anchor="start" >São Paulo holds 1,849 seller IDs</text><text x="293" y="866" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >About 59.74% of the 3,095 recorded sellers.</text><text x="293" y="889" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >The other 1,246 IDs span 22 source states.</text><text x="293" y="912" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Useful geographic context, not service quality.</text><rect x="836" y="763" width="577" height="193" rx="17" fill="#FFFFFF" stroke="#D7E7E3" filter="url(#shadow)"/><rect x="854" y="784" width="7" height="151" rx="4" fill="#079786" /><text x="877" y="806" font-size="14" fill="#079786" font-weight="700" text-anchor="start" >BUSINESS BOUNDARY</text><text x="877" y="840" font-size="24" fill="#14272D" font-weight="700" text-anchor="start" >Context, not performance</text><text x="877" y="866" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >This chart describes seller master data only.</text><text x="877" y="889" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >It does not measure orders, revenue or delays.</text><text x="877" y="912" font-size="14" fill="#5D7480" font-weight="400" text-anchor="start" >Do not infer delivery reliability from this chart.</text><line x1="257" y1="980" x2="1412" y2="980" stroke="#CBDEDA" stroke-width="1" /><text x="257" y="999" font-size="12" fill="#5D7480" font-weight="400" text-anchor="start" >Source: Olist Brazilian E-Commerce Public Dataset | Brazil 2016–2018 | BRL</text><text x="1408" y="999" font-size="12" fill="#5D7480" font-weight="400" text-anchor="end" >Supporting chart</text></g></svg>