name: Validate Olist source and ETL
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Reconcile published aggregate evidence
        run: python scripts/check_processed_outputs.py --processed data/processed
      - name: Check verified source and optional workbook
        run: python scripts/verify_bundle.py
